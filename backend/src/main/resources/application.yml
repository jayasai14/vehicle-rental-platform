server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: vehicle-rental-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vehicle_rental_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:vehicle_user}
    password: ${SPRING_DATASOURCE_PASSWORD:vehicle_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiration-ms: 900000 # 15 minutes
  refresh-token-expiration-ms: 604800000 # 7 days

app:
  storage:
    type: local
    local-path: ${STORAGE_LOCAL_PATH:./uploads}
  operational:
    booking-hold-ttl-minutes: 15
    verification-window-minutes: 60
    refund-dispute-window-hours: 72
    deposit-dispute-window-hours: 48
    turnaround-buffer-car-minutes: 60
    turnaround-buffer-bike-minutes: 30
    turnaround-buffer-scooter-minutes: 30
